name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Formatter output differs between Elixir versions, so only the one in .tool-versions checks it
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "28"
      - run: mix format --check-formatted

  # TODO: The new consumer group does not work with kafka 3.9, so it is not on the kafka list for now
  # later we must skip some tests based on the supported features defined on API versions negotiation
  tests:
    name: test-kafka-${{ matrix.kafka }}-elixir-${{ matrix.beam.elixir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kafka: ["4.0", "4.4"]
        beam:
          - elixir: "1.20"
            otp: "28"
          - elixir: "1.17"
            otp: "26"
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.beam.elixir }}
          otp-version: ${{ matrix.beam.otp }}
      # returns once every broker is healthy and the SCRAM users exist
      - run: docker compose -f "test/compose_files/docker-compose-kafka-${{ matrix.kafka }}.yml" up -d --wait --wait-timeout 180
      - run: MIX_ENV=prod mix deps.get
      - run: MIX_ENV=prod mix compile --warnings-as-errors
      - run: KLIFE_KAFKA_VSN=${{ matrix.kafka }} mix test --warnings-as-errors
      - if: failure()
        run: docker compose -f "test/compose_files/docker-compose-kafka-${{ matrix.kafka }}.yml" logs --no-color
