x-kafka-env: &kafka-env
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller1:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_UNSTABLE_API_VERSIONS_ENABLE: true
  KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS: classic,consumer,share
  KAFKA_GROUP_CONSUMER_MIN_HEARTBEAT_INTERVAL_MS: 500
  KAFKA_GROUP_CONSUMER_HEARTBEAT_INTERVAL_MS: 2000
  KAFKA_LOG_RETENTION_HOURS: 1000
  KAFKA_LOG_RETENTION_BYTES: -1
  KAFKA_OFFSETS_RETENTION_MINUTES: 100000
  KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 10000000

x-broker-env: &broker-env
  <<: *kafka-env
  KAFKA_PROCESS_ROLES: broker
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENERS: INTERNAL://:9091,EXTERNAL_PLAIN://:9092,EXTERNAL://:9094,AUTH://:9095
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL_PLAIN:PLAINTEXT,EXTERNAL:SSL,AUTH:SASL_SSL,CONTROLLER:PLAINTEXT
  KAFKA_SSL_KEYSTORE_TYPE: PEM
  KAFKA_SSL_KEYSTORE_LOCATION: /tls/server.pem
  KAFKA_SSL_TRUSTSTORE_TYPE: PEM
  KAFKA_SSL_TRUSTSTORE_LOCATION: /tls/ca.crt
  KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/broker.jaas.conf
  KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512,OAUTHBEARER
  KAFKA_LISTENER_NAME_AUTH_OAUTHBEARER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="klifeusr";'
  KAFKA_LISTENER_NAME_AUTH_SCRAM___SHA___256_CONNECTIONS_MAX_REAUTH_MS: 3600000
  KAFKA_LISTENER_NAME_AUTH_SCRAM___SHA___512_CONNECTIONS_MAX_REAUTH_MS: 3600000
  KAFKA_HEAP_OPTS: -Xms${BROKER_HEAP:-512m} -Xmx${BROKER_HEAP:-512m}

x-broker: &broker
  image: apache/kafka:${KAFKA_VERSION:-4.4.0}
  cpus: ${BROKER_CPUS:-1}
  mem_limit: ${BROKER_MEMORY:-1g}
  depends_on:
    controller1: {condition: service_started}
    certs: {condition: service_completed_successfully}
  volumes:
    - tls:/tls:ro
    - ../test/compose_files/sasl/broker.jaas.conf:/etc/kafka/broker.jaas.conf:ro
  healthcheck:
    test: [CMD, bash, -c, "</dev/tcp/localhost/9092"]
    interval: 2s
    timeout: 2s
    retries: 90
  stop_grace_period: 10s

services:
  certs:
    image: ${SIM_IMAGE:-klife-simulator:local}
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    entrypoint: [sh, /app/simulator/docker/generate-certs.sh]
    cpus: 0.5
    mem_limit: 128m
    volumes:
      - tls:/tls

  controller1:
    image: apache/kafka:${KAFKA_VERSION:-4.4.0}
    cpus: ${CONTROLLER_CPUS:-0.5}
    mem_limit: ${CONTROLLER_MEMORY:-512m}
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_HEAP_OPTS: -Xms${CONTROLLER_HEAP:-256m} -Xmx${CONTROLLER_HEAP:-256m}

  kafka1:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:9091,EXTERNAL_PLAIN://kafka1:9092,EXTERNAL://kafka1:9094,AUTH://kafka1:9095

  kafka2:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:9091,EXTERNAL_PLAIN://kafka2:9092,EXTERNAL://kafka2:9094,AUTH://kafka2:9095

  kafka3:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 4
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:9091,EXTERNAL_PLAIN://kafka3:9092,EXTERNAL://kafka3:9094,AUTH://kafka3:9095

  scram-users:
    image: apache/kafka:${KAFKA_VERSION:-4.4.0}
    init: true
    cpus: 0.5
    mem_limit: 512m
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    environment:
      SCRAM_BOOTSTRAP_SERVER: kafka1:9091
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    command: [bash, /etc/kafka/scram-users.sh]
    volumes:
      - ../test/compose_files/sasl/scram-users.sh:/etc/kafka/scram-users.sh:ro
    healthcheck:
      test: [CMD, bash, -c, "[ -f /tmp/scram-users-ready ]"]
      interval: 2s
      timeout: 2s
      retries: 90

  simulator:
    image: ${SIM_IMAGE:-klife-simulator:local}
    build:
      context: ..
      dockerfile: simulator/Dockerfile
    init: true
    user: ${SIM_UID:-1000}:${SIM_GID:-1000}
    group_add:
      - ${DOCKER_GID:-0}
    cpus: ${SIM_CPUS:-2}
    mem_limit: ${SIM_MEMORY:-2g}
    depends_on:
      scram-users: {condition: service_healthy}
    environment:
      SIM_PROJECT: ${COMPOSE_PROJECT_NAME}
      SIM_CONTAINER: "true"
      SIM_CPUS: ${SIM_CPUS:-2}
      SIM_MEMORY: ${SIM_MEMORY:-2g}
      BROKER_CPUS: ${BROKER_CPUS:-1}
      BROKER_MEMORY: ${BROKER_MEMORY:-1g}
      BROKER_HEAP: ${BROKER_HEAP:-512m}
      CONTROLLER_CPUS: ${CONTROLLER_CPUS:-0.5}
      CONTROLLER_MEMORY: ${CONTROLLER_MEMORY:-512m}
      CONTROLLER_HEAP: ${CONTROLLER_HEAP:-256m}
      KAFKA_VERSION: ${KAFKA_VERSION:-4.4.0}
      SIM_IMAGE: ${SIM_IMAGE:-klife-simulator:local}
      SIM_CONFIG: ${SIM_CONFIG:-}
      MULTI_RUN: "true"
      RUN_SECONDS: ${RUN_SECONDS:-900}
      TOTAL_SECONDS: ${TOTAL_SECONDS:-86400}
      FORCE_STABLE: ${FORCE_STABLE:-false}
      SASL_MECHANISM: ${SASL_MECHANISM:-}
      OAUTH_TOKEN_LIFETIME_S: ${OAUTH_TOKEN_LIFETIME_S:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tls:/tls:ro
      - ${SIM_OUTPUT_DIR:-./simulations_data/${COMPOSE_PROJECT_NAME}}:/app/simulator/simulations_data
      - type: bind
        source: ${SIM_REPLAY_DIR:-./docker}
        target: /replay
        read_only: true
        bind:
          create_host_path: false
    stop_grace_period: 30s

volumes:
  tls:
