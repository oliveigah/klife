      KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:39091,EXTERNAL_PLAIN://localhost:39092,EXTERNAL://localhost:39093,SASL_SSL://localhost:39094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL_PLAIN:PLAINTEXT,EXTERNAL:SSL,SASL_SSL:SASL_SSL,CONTROLLER:PLAINTEXT
      KAFKA_SSL_KEYSTORE_LOCATION: /secrets/kafka.keystore.jks
      KAFKA_SSL_TRUSTSTORE_LOCATION: /secrets/kafka.truststore.jks
      KAFKA_SSL_KEY_PASSWORD: klifeclient
      KAFKA_SSL_KEYSTORE_PASSWORD: klifeclient
      KAFKA_SSL_TRUSTSTORE_PASSWORD: klifeclient
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN,SCRAM-SHA-256,SCRAM-SHA-512,OAUTHBEARER
      # Own JAAS entry: the default (unsecured) OAUTHBEARER validator refuses a section with other modules
      KAFKA_LISTENER_NAME_SASL__SSL_OAUTHBEARER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="klifeusr";'
      # SCRAM sessions end after an hour, so tests see the lifetime the broker reports
      KAFKA_LISTENER_NAME_SASL__SSL_SCRAM___SHA___256_CONNECTIONS_MAX_REAUTH_MS: 3600000
      KAFKA_LISTENER_NAME_SASL__SSL_SCRAM___SHA___512_CONNECTIONS_MAX_REAUTH_MS: 3600000
      KAFKA_SSL_KEYSTORE_FILENAME: kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: creds
      KAFKA_SSL_KEY_CREDENTIALS: creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: broker_truststore_creds
      KAFKA_SASL_KERBEROS_SERVICE_NAME: klife
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - ./ssl/localhost.keystore.jks:/secrets/kafka.keystore.jks:ro,z
      - ./ssl/localhost.keystore.jks:/etc/kafka/secrets/kafka.keystore.jks
      - ./ssl/localhost.truststore.jks:/secrets/kafka.truststore.jks:ro,z
      - ./ssl/localhost.truststore.jks:/etc/kafka/secrets/kafka.truststore.jks
      - ./sasl/broker.jaas.conf:/etc/kafka/kafka_server_jaas.conf
      - ./sasl/creds:/etc/kafka/secrets/creds
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/39092"]
      interval: 2s
      timeout: 2s
      retries: 60

  scram-users:
    image: apache/kafka:3.9.0
    depends_on:
      kafka1: {condition: service_healthy}
      kafka2: {condition: service_healthy}
      kafka3: {condition: service_healthy}
    network_mode: host
    init: true
    command: ["/bin/bash", "/etc/kafka/scram-users.sh"]
    volumes:
      - ./sasl/scram-users.sh:/etc/kafka/scram-users.sh
    healthcheck:
      test: ["CMD", "bash", "-c", "[ -f /tmp/scram-users-ready ]"]
      interval: 2s
      timeout: 2s
      retries: 60
